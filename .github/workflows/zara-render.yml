name: Zara Gaming Cloud - Review Render

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/render_zara.py'
      - '.github/scripts/cinematic_finish.py'
      - '.github/scripts/toplist_editor.py'
      - '.github/scripts/upload_private_test.py'
      - '.github/workflows/zara-render.yml'
  workflow_dispatch:
    inputs:
      job_id:
        description: "Existing draft ID, e.g. 2026-11-16:short"
        required: false
        type: string
      smoke_test:
        description: "Verify FFmpeg without AI calls, uploads, or licensed media"
        required: false
        default: true
        type: boolean
      private_upload_test:
        description: "Owner-only PRIVATE upload of a 3-second synthetic diagnostic; never public"
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub schedules can be delayed. Cloudflare queues the drafts 20m earlier.
    - cron: '20 14 * * *'   # 19:20 Pakistan, daily Shorts
    - cron: '20 16 * * 0,3' # 21:20 Pakistan, Sun/Wed AI fiction

permissions:
  contents: read
  id-token: write

concurrency:
  group: zara-review-render
  cancel-in-progress: false

jobs:
  render:
    # First manually reviewed pilot only. Scheduled jobs remain paused until
    # access, content, and final video quality are verified by the owner.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout review renderer
        uses: actions/checkout@v4

      - name: Check FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Verify Top 5 / Top 10 editor code
        run: python3 -m py_compile .github/scripts/toplist_editor.py .github/scripts/cinematic_finish.py

      - name: Build cinematic AI-concept review video
        env:
          # One first-batch pilot uses an existing draft, then cron picks current drafts.
          ZARA_JOB_ID: ${{ github.event_name == 'push' && '2026-11-16:short' || github.event.inputs.job_id || '' }}
          ZARA_SCHEDULE: ${{ github.event.schedule || '' }}
          ZARA_SMOKE_TEST: ${{ github.event_name == 'push' && '1' || inputs.smoke_test && '1' || '' }}
        run: python3 .github/scripts/render_zara.py

      - name: Save preview for owner review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zara-ai-concept-for-review
          path: preview_output/*.mp4
          retention-days: 2
          if-no-files-found: ignore

      - name: Test Google YouTube PRIVATE upload (manual owner run only)
        if: github.event_name == 'workflow_dispatch' && inputs.private_upload_test == true && inputs.smoke_test == true
        run: python3 .github/scripts/upload_private_test.py
